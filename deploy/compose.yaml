# Provision files per README.md before starting. No sample credential works.
x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fengkong
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets/postgres-admin-password:/run/secrets/admin-password:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d fengkong"]
      interval: 5s
      timeout: 5s
      retries: 10
  storage-migrate:
    <<: *common
    profiles: [maintenance]
    command: [python, -m, agent.storage.migrate, --grant, collector=fk_collector, --grant, runtime=fk_runtime, --grant, projector=fk_projector, --grant, agent=fk_agent, --grant, reviewer=fk_reviewer, --grant, graph=fk_graph]
    environment:
      FK_ENV: production
      FK_STORAGE_BACKEND: postgres
      FK_DATABASE_URL_FILE: /run/secrets/database-url
      FK_AUTH_CONFIG: /config/collector-auth.json
      FK_DATA_DIR: /tenant
      FK_AGENT_STATE_ROOT: /agent-state
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/admin-database-url:/run/secrets/database-url:ro
      - ./config/collector-auth.json:/config/collector-auth.json:ro
      - ./state/tenant:/tenant:ro
      - ./state/agent-state:/agent-state:ro
  collector:
    <<: *common
    command: [python, serve.py, --host, "0.0.0.0", --port, "8081"]
    ports: ["127.0.0.1:8081:8081"]
    environment:
      FK_STORAGE_BACKEND: postgres
      FK_DATABASE_URL_FILE: /run/secrets/database-url
      FK_ENV: production
      FK_AUTH_CONFIG: /config/collector-auth.json
      FK_COLLECTOR_KEYS: /keys/collector-keys.json
      FK_IDENTITY_KEY_FILE: /keys/identity.key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/collector-database-url:/run/secrets/database-url:ro
      - ./state/tenant:/tenant
      - ./state/collector-out:/app/out
      - ./config/collector-auth.json:/config/collector-auth.json:ro
      - ./secrets/collector-keys.json:/keys/collector-keys.json:ro
      - ./secrets/identity.key:/keys/identity.key:ro
      - ./config/apple-app-attest-root.pem:/trust/apple-app-attest-root.pem:ro
  graph-worker:
    <<: *common
    command: [python, -m, agent.graph_worker, --interval, "1", --limit, "100"]
    environment:
      FK_STORAGE_BACKEND: postgres
      FK_GRAPH_REFRESH_POLICY: ${FK_GRAPH_REFRESH_POLICY:-strict}
      FK_DATABASE_URL_FILE: /run/secrets/database-url
      FK_ENV: production
      FK_AUTH_CONFIG: /config/collector-auth.json
      FK_DATA_DIR: /tenant
      FK_GRAPH_ALGORITHM: community_v1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/graph-database-url:/run/secrets/database-url:ro
      - ./state/tenant:/tenant
      - ./config/collector-auth.json:/config/collector-auth.json:ro

  runtime:
    <<: *common
    command: [python, serve.py, --host, "0.0.0.0", --port, "8080"]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      FK_STORAGE_BACKEND: postgres
      FK_GRAPH_REFRESH_POLICY: ${FK_GRAPH_REFRESH_POLICY:-strict}
      FK_DATABASE_URL_FILE: /run/secrets/database-url
      FK_ENV: production
      FK_AUTH_CONFIG: /config/runtime-auth.json
      FK_AGENT_STATE_ROOT: /agent-state
      FK_RUNTIME_BUNDLE_DIR: /release
      FK_RUNTIME_PUBLIC_KEY: /config/publisher.pub
      FK_RUNTIME_CACHE_DIR: /app/out/runtime-cache
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/runtime-database-url:/run/secrets/database-url:ro
      - ./state/tenant:/tenant
      - ./state/runtime-out:/app/out
      - ./state/agent-state:/agent-state:ro
      - ./config/runtime-auth.json:/config/runtime-auth.json:ro
      - ./config/publisher.pub:/config/publisher.pub:ro
      - ./state/bundles:/release:ro
  case-projector:
    <<: *common
    command: [python, -m, agent.case_worker, --interval, "1", --limit, "100"]
    environment:
      FK_STORAGE_BACKEND: postgres
      FK_DATABASE_URL_FILE: /run/secrets/database-url
      FK_ENV: production
      FK_AUTH_CONFIG: /config/projector-auth.json
      FK_PROJECTOR_TOKEN: ${FK_PROJECTOR_TOKEN:-}
      FK_AGENT_STATE_ROOT: /agent-state
      FK_AGENT_AUDIT_ROOT: /agent-audit
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/projector-database-url:/run/secrets/database-url:ro
      - ./state/tenant:/tenant:ro
      - ./state/agent-state:/agent-state
      - ./state/agent-audit:/agent-audit
      - ./config/projector-auth.json:/config/projector-auth.json:ro
  agent:
    <<: *common
    profiles: [investigate]
    command: [python, main.py]
    stdin_open: true
    tty: true
    environment:
      FK_STORAGE_BACKEND: postgres
      FK_DATABASE_URL_FILE: /run/secrets/database-url
      FK_ENV: production
      FK_AUTH_CONFIG: /config/agent-auth.json
      FK_AGENT_STATE_ROOT: /agent-state
      FK_AGENT_AUDIT_ROOT: /agent-audit
      FK_AGENT_TOKEN: ${FK_AGENT_TOKEN:-}
      FK_RUNTIME_BUNDLE_DIR: /release
      FK_RUNTIME_PUBLIC_KEY: /config/publisher.pub
      FK_RUNTIME_CACHE_DIR: /app/out/runtime-cache
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/agent-database-url:/run/secrets/database-url:ro
      - ./state/tenant:/tenant:ro
      - ./state/agent-out:/app/out
      - ./state/agent-state:/agent-state
      - ./state/agent-audit:/agent-audit
      - ./config/agent-auth.json:/config/agent-auth.json:ro
      - ./config/publisher.pub:/config/publisher.pub:ro
      - ./state/bundles:/release:ro
  case-review:
    <<: *common
    profiles: [investigate]
    command: [python, -m, agent.review_service, --host, "0.0.0.0", --port, "8090"]
    ports: ["127.0.0.1:8090:8090"]
    environment:
      FK_STORAGE_BACKEND: postgres
      FK_DATABASE_URL_FILE: /run/secrets/database-url
      FK_ENV: production
      FK_AUTH_CONFIG: /config/reviewer-auth.json
      FK_AGENT_STATE_ROOT: /agent-state
      FK_AGENT_AUDIT_ROOT: /agent-audit
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/reviewer-database-url:/run/secrets/database-url:ro
      - ./state/tenant:/tenant:ro
      - ./state/agent-state:/agent-state
      - ./state/agent-audit:/agent-audit
      - ./config/reviewer-auth.json:/config/reviewer-auth.json:ro
  controller:
    <<: *common
    profiles: [release]
    command: [python, -m, agent.control_plane, --store, /journal/releases.json, --credentials, /config/release-auth.json, --scope, "tenant:a/app:app", --compute-capacity, /config/compute-capacity.json]
    stdin_open: true
    network_mode: none
    volumes:
      - ./state/journal:/journal
      - ./config/release-auth.json:/config/release-auth.json:ro
      - ./config/compute-capacity.json:/config/compute-capacity.json:ro
  publisher:
    <<: *common
    profiles: [release]
    command: [python, -m, agent.release_publisher, --store, /journal/releases.json, --output, /release, --private-key, /keys/publisher.pem]
    network_mode: none
    volumes:
      - ./state/journal:/journal:ro
      - ./state/bundles:/release
      - ./secrets/publisher.pem:/keys/publisher.pem:ro

volumes:
  postgres-data:
