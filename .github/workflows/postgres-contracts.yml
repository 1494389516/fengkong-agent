name: PostgreSQL persistence contracts
on:
  push:
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: fengkong_contracts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FK_DATABASE_URL: postgresql://postgres:contract-test-only@localhost:5432/fengkong_contracts
      FK_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v eval.postgres_contracts
      - name: Isolated DBOS recovery experiment
        env:
          FK_DBOS_DATABASE_URL: postgresql+psycopg://postgres:contract-test-only@localhost:5432/fengkong_contracts
        run: |
          python -m pip install -r experiments/dbos/requirements.txt
          python -m experiments.dbos.recovery_probe
