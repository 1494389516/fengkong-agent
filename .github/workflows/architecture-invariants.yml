name: Architecture invariants
on:
  pull_request:
  push:
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q agent serve.py
      - name: Risk-control architecture gates
        run: python eval/architecture_invariants.py
      - name: Graph pipeline smoke
        run: python -m eval.graph_pipeline_smoke
      - name: Graph PIT and model adapter smoke
        run: python -m eval.graph_pit_model_smoke
      - name: Graph model evaluation and registry smoke
        run: python -m eval.graph_model_eval_smoke
      - name: Event bus leasing and dead-letter smoke
        run: python -m eval.event_bus_leasing_smoke
      - name: Graph worker observability smoke
        run: python -m eval.graph_worker_observability_smoke
      - name: Graph projection regressions
        run: python -m eval.graph_projection_regressions
      - name: Agent token budget regressions
        run: python -m eval.token_budget_regressions
