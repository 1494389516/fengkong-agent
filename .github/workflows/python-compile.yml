name: Python compilation
on:
  pull_request:
  push:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime and operational sources
        run: python -m compileall -q agent scripts main.py serve.py
