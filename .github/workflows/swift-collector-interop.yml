name: Native Swift Collector interoperability
on:
  pull_request:
  push:
jobs:
  native-wire:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent
      - uses: actions/checkout@v4
        with:
          repository: 1494389516/cloudphone-risk-detector
          ref: f763c322b9e087102a2b7683fe20d78391540a91
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt
      - name: Execute native SDK encoder and signer
        working-directory: agent
        run: python scripts/run_swift_collector.py --sdk ../sdk --output out/swift-wire.jsonl
      - name: Verify Collector, event bus, evidence and scripted investigation
        working-directory: agent
        env:
          FK_SWIFT_WIRE: out/swift-wire.jsonl
        run: python -m eval.swift_collector_interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-collector-wire
          path: agent/out/swift-wire*
          if-no-files-found: ignore
