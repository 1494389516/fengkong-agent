<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件复核</title><link rel="stylesheet" href="/review.css"><main><h1>案件复核</h1><p>对照证据、反证和缺口复核当前修订。复核不会直接变更线上策略。</p><label>短期复核凭证 <input id="token" type="password" autocomplete="off"></label><button id="load">加载案件</button><p id="status" role="status"></p><section id="cases"></section><article id="detail"></article><form id="review" hidden><label>结论 <select id="verdict"><option value="insufficient">证据不足</option><option value="confirmed_risk">确认风险</option><option value="benign">正常解释成立</option></select></label><label>复核依据与反证 <textarea id="note" required maxlength="4000"></textarea></label><label>标签成熟时间 <input id="maturity" type="datetime-local" required></label><button type="submit">提交当前修订的复核</button></form></main><script src="/review.js"></script></html>
